<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- An adult face, deliberately androgynous: a longer oval than a baby's
       round head, features set at mid-height rather than low, hair a plain
       cap that reads as neither short nor long, and no rosy cheeks. Drawn
       heavy and low-detail so it still holds together at 16px. -->
  <!-- ears -->
  <circle cx="6.6" cy="17.4" r="1.9" fill="#f7c9a6" />
  <circle cx="25.4" cy="17.4" r="1.9" fill="#f7c9a6" />
  <!-- head: taller than wide, jaw narrowing to the chin -->
  <path d="M16 3.6c-5.4 0-9 3.4-9 9.2 0 5 .9 8.4 2.7 10.8 1.6 2.1 3.7 3.2 6.3 3.2s4.7-1.1 6.3-3.2c1.8-2.4 2.7-5.8 2.7-10.8 0-5.8-3.6-9.2-9-9.2z" fill="#f7c9a6" />
  <!-- hair: a plain cap, level across the brow, tucked behind the ears -->
  <path d="M16 2.4c-5.6 0-9.3 3.4-9.3 9 0 1.3.2 2.4.5 3.4l1.5-.5c-.2-1.6.1-2.8.9-3.7 1.5.9 3.7 1.4 6.4 1.4s4.9-.5 6.4-1.4c.8.9 1.1 2.1.9 3.7l1.5.5c.3-1 .5-2.1.5-3.4 0-5.6-3.7-9-9.3-9z" fill="#8a5a38" />
  <!-- brows -->
  <path d="M10.9 14.4h3.1M18 14.4h3.1" fill="none" stroke="#8a5a38" stroke-width="1.4" stroke-linecap="round" />
  <!-- eyes, at mid-face -->
  <circle cx="12.4" cy="17.4" r="1.5" fill="#3b2c25" />
  <circle cx="19.6" cy="17.4" r="1.5" fill="#3b2c25" />
  <!-- mouth: a level line with the faintest lift at the ends -->
  <path d="M13.2 22.4c1 .9 4.6.9 5.6 0" fill="none" stroke="#3b2c25" stroke-width="1.6" stroke-linecap="round" />
</svg>
